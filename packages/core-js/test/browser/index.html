<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Types Browser Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { color: #00d9ff; }
    .result { padding: 8px 12px; margin: 4px 0; border-radius: 4px; }
    .pass { background: #1e4620; }
    .fail { background: #5c1e1e; }
    .error { font-size: 12px; color: #ff6b6b; margin-top: 4px; }
    #console {
      background: #0d0d1a;
      padding: 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }
    .summary { margin-top: 20px; padding: 16px; background: #16213e; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Browser Bundle Test</h1>
  <p>Testing Core Types imports in browser environment</p>

  <h2>Console Output</h2>
  <div id="console"></div>

  <div class="summary">
    <h2>Results</h2>
    <div id="results">Loading...</div>
  </div>

  <script>
    const consoleDiv = document.getElementById('console');
    const originalLog = console.log;
    const originalError = console.error;

    console.log = (...args) => {
      originalLog.apply(console, args);
      consoleDiv.textContent += args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') + '\n';
    };

    console.error = (...args) => {
      originalError.apply(console, args);
      consoleDiv.innerHTML += '<span style="color:#ff6b6b">' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') + '</span>\n';
    };
  </script>
  <script src="./bundle.js"></script>
  <script>
    setTimeout(() => {
      const resultsDiv = document.getElementById('results');
      const results = window.__TEST_RESULTS__;

      if (!results) {
        resultsDiv.innerHTML = '<div class="result fail">Tests did not complete - check console for errors</div>';
        return;
      }

      resultsDiv.innerHTML = results.map(r => 
        '<div class="result ' + r.status + '">' +
          (r.status === 'pass' ? '✓' : '✗') + ' ' + r.name +
          (r.error ? '<div class="error">' + r.error + '</div>' : '') +
        '</div>'
      ).join('');
    }, 1000);
  </script>
</body>
</html>
