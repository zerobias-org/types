type: object
description: Connection profile for SDK API clients
required:
  - url
properties:
  url:
    type: string
    format: url
    description: Service URL (full URL string including protocol, host, port, and path)
    example: "https://api.zerobias.com"
  apiKey:
    type: string
    description: API key for authentication
  jwt:
    type: string
    description: JWT for authentication
  session:
    type: string
    description: Session token for authentication (e.g., Dana session); takes precedence over jwt and apiKey
  orgId:
    type: string
    format: uuid
    description: Organization ID
